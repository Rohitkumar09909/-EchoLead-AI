server.port=8080
spring.datasource.url=jdbc:h2:file:./data/echolead;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
echolead.ai.api-key=${OPENAI_API_KEY:}
echolead.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
echolead.ai.model=${AI_MODEL:gpt-4o-mini}
